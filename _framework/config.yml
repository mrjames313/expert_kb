framework_version: 2026-08-23   # bumped by upgrades; see UPGRADING.md
capabilities:
  multi_area: false
  por: false
  task_subagents: false
  formal_review: false
lint:
  pulse_line_cap: 80
  stale_concept_threshold_active_days: 30
  promotion_freshness_active_days: 14
  spec_abandonment_active_days: 60
  exchange_stale_active_days: 7
  cross_area_link_threshold: 3
  recent_decisions_window_active_days: 7
  shadow_suggest_threshold: 5
  # One key per shipped warning rule (module with SEVERITY="warning" + CONFIG_KEY).
  # `/framework enable-lint <rule>` flips these; absent keys default to false
  # (shadowed). Rules 4/8/9/10/11/13/14/16 are planned but unimplemented — see
  # future-work.md — so they are intentionally not listed.
  warnings_visible:
    rule_10_promotion_freshness: false
    rule_20_commons_drift: false
    rule_21_commons_twin_links: false
prune:
  full_tier_stale_sessions: 10
  frontmatter_tier_stale_sessions: 30
